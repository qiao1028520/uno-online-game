<style>

    box-shadow:0 4px 10px rgba(0,0,0,.2);

  .color-indicator {

<script>
// ========== 卡牌定义 ==========
const COLORS = ['red', 'yellow', 'green', 'blue'];
const CARD_TYPE = { NUMBER:'number', SKIP:'skip', REVERSE:'reverse', DRAW2:'draw2', WILD:'wild', WILD4:'wild4' };
const CARD_SYMBOL = { skip:'⊘', reverse:'⇄', draw2:'+2', wild:'★', wild4:'+4' };
const COLOR_HEX = { red:'#FF595E', yellow:'#FFCA3A', green:'#8AC926', blue:'#1982C4', wild:'#6A4C93' };

function createDeck() {
  const deck = []; let id = 0;
  for (const color of COLORS) {
    deck.push({id:id++, color, type:CARD_TYPE.NUMBER, value:'0'});
    for (let n=1;n<=9;n++){ deck.push({id:id++,color,type:CARD_TYPE.NUMBER,value:String(n)}); deck.push({id:id++,color,type:CARD_TYPE.NUMBER,value:String(n)}); }
    for (const t of [CARD_TYPE.SKIP,CARD_TYPE.REVERSE,CARD_TYPE.DRAW2]){ deck.push({id:id++,color,type:t,value:CARD_SYMBOL[t]}); deck.push({id:id++,color,type:t,value:CARD_SYMBOL[t]}); }
  }
  for (let i=0;i<4;i++){ deck.push({id:id++,color:'wild',type:CARD_TYPE.WILD,value:CARD_SYMBOL.wild}); deck.push({id:id++,color:'wild',type:CARD_TYPE.WILD4,value:CARD_SYMBOL.wild4}); }
  return deck;
}
function shuffle(deck){ const a=[...deck]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ========== 规则 ==========
function canPlay(card, topCard, activeColor, drawStack=0){
  if(drawStack>0){
    if(topCard.type===CARD_TYPE.DRAW2) return card.type===CARD_TYPE.DRAW2;
    if(topCard.type===CARD_TYPE.WILD4) return card.type===CARD_TYPE.WILD4;
  }
  if(card.type===CARD_TYPE.WILD||card.type===CARD_TYPE.WILD4) return true;
  if(card.color===activeColor) return true;
  if(card.type===CARD_TYPE.NUMBER&&topCard.type===CARD_TYPE.NUMBER&&card.value===topCard.value) return true;
  if(card.type!==CARD_TYPE.NUMBER&&card.type===topCard.type) return true;
  return false;
}
function getCardEffect(card){
  switch(card.type){
    case CARD_TYPE.SKIP: return {skipNext:true,reverseDirection:false,drawCount:0};
    case CARD_TYPE.REVERSE: return {skipNext:false,reverseDirection:true,drawCount:0};
    case CARD_TYPE.DRAW2: return {skipNext:true,reverseDirection:false,drawCount:2};
    case CARD_TYPE.WILD4: return {skipNext:true,reverseDirection:false,drawCount:4};
    default: return {skipNext:false,reverseDirection:false,drawCount:0};
  }
}

// ========== UnoGame ==========
class UnoGame {
  constructor(){ this.reset(); }
  reset(){
    this.phase='waiting'; this.drawPile=[]; this.discardPile=[]; this.players=[];
    this.dealerIndex=0; this.currentPlayerIndex=0; this.direction=1; this.activeColor=null;
    this.drawStack=0; this.pendingWildColor=null; this.winner=null; this.lastAction=null;
    this.unoCallTimers=new Map();
  }
  start(players){
    this.reset();
    this.players=players.map(p=>({id:p.id,name:p.name,hand:[],hasCalledUno:false,isOnline:true}));
    this.drawPile=shuffle(createDeck());
    for(let i=0;i<7;i++) for(const p of this.players) p.hand.push(this.drawPile.pop());
    let first=this.drawPile.pop();
    while(first.type===CARD_TYPE.WILD4){ this.drawPile.unshift(first); first=this.drawPile.pop(); }
    this.discardPile.push(first);
    this.activeColor=first.color==='wild'?COLORS[Math.floor(Math.random()*4)]:first.color;
    const effect=getCardEffect(first);
    this.direction=effect.reverseDirection?-1:1;
    if(effect.drawCount>0) this.drawStack=effect.drawCount;
    this.dealerIndex=0; this.currentPlayerIndex=this.nextIndex(this.dealerIndex);
    if(effect.skipNext) this.currentPlayerIndex=this.nextIndex(this.currentPlayerIndex);
    this.phase='playing'; this.lastAction={type:'start',card:first,timestamp:Date.now()};
  }
  playCard(playerId, cardIndex, chosenColor){
    const player=this.players.find(p=>p.id===playerId);
    if(!player) return {ok:false,error:'player_not_found'};
    const idx=this.players.indexOf(player);
    if(idx!==this.currentPlayerIndex) return {ok:false,error:'not_your_turn'};
    if(this.phase!=='playing') return {ok:false,error:'game_not_playing'};
    if(this.pendingWildColor&&playerId===this.players[this.currentPlayerIndex].id) return {ok:false,error:'must_choose_color'};
    const card=player.hand[cardIndex];
    if(!card) return {ok:false,error:'invalid_card'};
    const topCard=this.discardPile[this.discardPile.length-1];
    if(!canPlay(card,topCard,this.activeColor,this.drawStack)) return {ok:false,error:'cannot_play_card'};
    if(card.type===CARD_TYPE.WILD||card.type===CARD_TYPE.WILD4){
      if(!chosenColor||!COLORS.includes(chosenColor)) return {ok:false,error:'need_color'};
    }
    const events=[];
    player.hand.splice(cardIndex,1);
    this.discardPile.push(card);
    this.clearUnoTimer(playerId); player.hasCalledUno=false;
    const effect=getCardEffect(card);
    if(card.type===CARD_TYPE.WILD||card.type===CARD_TYPE.WILD4) this.activeColor=chosenColor;
    else this.activeColor=card.color;
    if(effect.drawCount>0) this.drawStack+=effect.drawCount;
    events.push({type:'card_played',playerId,card,chosenColor:(card.type===CARD_TYPE.WILD||card.type===CARD_TYPE.WILD4)?chosenColor:null,timestamp:Date.now()});
    this.lastAction={type:'play',playerId,card,timestamp:Date.now()};
    if(player.hand.length===0){ this.phase='finished'; this.winner=playerId; this.clearAllUnoTimers(); events.push({type:'game_over',winner:playerId}); return {ok:true,events}; }
    if(player.hand.length===1) this.startUnoTimer(playerId);
    this.advanceTurn(effect.skipNext);
    return {ok:true,events};
  }
  drawCard(playerId){
    const player=this.players.find(p=>p.id===playerId);
    if(!player) return {ok:false,error:'player_not_found'};
    const idx=this.players.indexOf(player);
    if(idx!==this.currentPlayerIndex) return {ok:false,error:'not_your_turn'};
    if(this.phase!=='playing') return {ok:false,error:'game_not_playing'};
    if(this.pendingWildColor) return {ok:false,error:'must_choose_color'};
    const topCard=this.discardPile[this.discardPile.length-1];
    const events=[];
    this.ensureDrawPile();
    let drawCount=1; let forcedDraw=false;
    if(this.drawStack>0){ drawCount=this.drawStack; forcedDraw=true; }
    const drawn=[];
    for(let i=0;i<drawCount;i++){ this.ensureDrawPile(); if(this.drawPile.length===0) break; drawn.push(this.drawPile.pop()); }
    player.hand.push(...drawn);
    if(forcedDraw){
      this.drawStack=0;
      events.push({type:'draw_cards',playerId,count:drawCount,forced:true,timestamp:Date.now()});
      this.lastAction={type:'draw',playerId,count:drawCount,timestamp:Date.now()};
      this.advanceTurn(true);
      return {ok:true,drawnCards:drawn,forcedDraw:true,events};
    }
    events.push({type:'draw_card',playerId,count:1,timestamp:Date.now()});
    this.lastAction={type:'draw',playerId,count:1,timestamp:Date.now()};
    const canPlayDrawn=drawn[0]&&canPlay(drawn[0],topCard,this.activeColor,0);
    return {ok:true,drawnCards:drawn,canPlayDrawn,forcedDraw:false,events};
  }
  passTurn(playerId){
    const player=this.players.find(p=>p.id===playerId);
    if(!player) return {ok:false,error:'player_not_found'};
    const idx=this.players.indexOf(player);
    if(idx!==this.currentPlayerIndex) return {ok:false,error:'not_your_turn'};
    this.advanceTurn(false);
    return {ok:true,events:[{type:'pass',playerId,timestamp:Date.now()}]};
  }
  callUno(playerId){
    const player=this.players.find(p=>p.id===playerId);
    if(!player) return {ok:false,error:'player_not_found'};
    if(player.hand.length!==1) return {ok:false,error:'not_one_card'};
    player.hasCalledUno=true; this.clearUnoTimer(playerId);
    return {ok:true,events:[{type:'uno_called',playerId,timestamp:Date.now()}]};
  }
  catchUno(targetPlayerId, byPlayerId){
    const target=this.players.find(p=>p.id===targetPlayerId);
    if(!target) return {ok:false,error:'player_not_found'};
    if(target.hand.length!==1) return {ok:false,error:'not_one_card'};
    if(target.hasCalledUno) return {ok:false,error:'already_called'};
    this.ensureDrawPile();
    const penalty=[];
    for(let i=0;i<2;i++){ this.ensureDrawPile(); if(this.drawPile.length===0) break; penalty.push(this.drawPile.pop()); }
    target.hand.push(...penalty);
    this.clearUnoTimer(targetPlayerId);
    return {ok:true,events:[{type:'uno_caught',targetPlayerId,byPlayerId,penaltyCount:penalty.length,timestamp:Date.now()}]};
  }
  chooseColor(playerId, color){
    if(!COLORS.includes(color)) return {ok:false,error:'invalid_color'};
    const player=this.players.find(p=>p.id===playerId);
    if(!player) return {ok:false,error:'player_not_found'};
    if(!this.pendingWildColor) return {ok:false,error:'no_pending_color'};
    if(this.players[this.currentPlayerIndex].id!==playerId) return {ok:false,error:'not_your_turn'};
    this.activeColor=color; this.pendingWildColor=null;
    return {ok:true,events:[{type:'color_chosen',playerId,color,timestamp:Date.now()}]};
  }
  advanceTurn(skipNext){ if(skipNext) this.currentPlayerIndex=this.nextIndex(this.currentPlayerIndex); this.currentPlayerIndex=this.nextIndex(this.currentPlayerIndex); }
  nextIndex(idx){ return (idx+this.direction+this.players.length)%this.players.length; }
  ensureDrawPile(){
    if(this.drawPile.length>0) return;
    if(this.discardPile.length<=1) return;
    const top=this.discardPile.pop();
    this.drawPile=shuffle(this.discardPile).map(c=>(c.type===CARD_TYPE.WILD||c.type===CARD_TYPE.WILD4?{...c,color:'wild'}:c));
    this.discardPile=[top];
  }
  startUnoTimer(playerId){
    this.clearUnoTimer(playerId);
    const timer=setTimeout(()=>{
      const player=this.players.find(p=>p.id===playerId);
      if(player&&player.hand.length===1&&!player.hasCalledUno){
        this.ensureDrawPile();
        for(let i=0;i<2;i++){ this.ensureDrawPile(); if(this.drawPile.length===0) break; player.hand.push(this.drawPile.pop()); }
      }
      this.unoCallTimers.delete(playerId);
    }, 5000);
    this.unoCallTimers.set(playerId, timer);
  }
  clearUnoTimer(playerId){ const t=this.unoCallTimers.get(playerId); if(t){ clearTimeout(t); this.unoCallTimers.delete(playerId); } }
  clearAllUnoTimers(){ for(const t of this.unoCallTimers.values()) clearTimeout(t); this.unoCallTimers.clear(); }
  snapshot(viewerId){
    const topCard=this.discardPile[this.discardPile.length-1]||null;
    return {
      phase:this.phase, currentPlayerId:this.players[this.currentPlayerIndex]?.id||null,
      direction:this.direction, activeColor:this.activeColor, drawPileCount:this.drawPile.length,
      discardPileCount:this.discardPile.length, discardTop:topCard, drawStack:this.drawStack,
      pendingWildColor:this.pendingWildColor, winner:this.winner, lastAction:this.lastAction,
      players:this.players.map(p=>({id:p.id,name:p.name,handCount:p.hand.length,hasCalledUno:p.hasCalledUno,isOnline:p.isOnline,hand:viewerId===p.id?p.hand:undefined}))
    };
  }
}

// ========== P2P 主机逻辑 ==========
class Host {
  constructor(peer, name){
    this.peer=peer; this.name=name; this.playerId='host';
    this.connections=new Map(); // conn -> {id, name, ready}
    this.game=new UnoGame();
    this.playerList=[{id:'host',name,ready:false,isHost:true}];
    this.roomId=peer.id;
    this.gamePhase='waiting';
    peer.on('connection', conn=>this.onConnection(conn));
  }
  onConnection(conn){
    conn.on('open', ()=>{
      conn.on('data', data=>this.onData(conn, data));
      conn.on('close', ()=>this.onDisconnect(conn));
      conn.on('error', ()=>this.onDisconnect(conn));
    });
  }
  onData(conn, data){
    const p=this.connections.get(conn);
    if(data.type==='join'){
      const pid='p_'+Math.random().toString(36).slice(2,8);
      this.connections.set(conn,{id:pid,name:data.name,ready:false});
      this.playerList.push({id:pid,name:data.name,ready:false,isHost:false});
      conn.send({type:'joined',playerId:pid,roomId:this.roomId});
      this.broadcastRoomState();
    } else if(p){
      if(data.type==='ready'){ p.ready=!p.ready; const pl=this.playerList.find(x=>x.id===p.id); if(pl) pl.ready=p.ready; this.broadcastRoomState(); }
      else if(data.type==='start_game'&&p.id==='host'){ this.startGame(); }
      else if(data.type==='play_card'){ const r=this.game.playCard(p.id,data.cardIndex,data.chosenColor); if(r.ok) this.broadcastGameState(); else conn.send({type:'error',message:r.error}); }
      else if(data.type==='draw_card'){ const r=this.game.drawCard(p.id); if(r.ok) this.broadcastGameState(); else conn.send({type:'error',message:r.error}); }
      else if(data.type==='pass'){ const r=this.game.passTurn(p.id); if(r.ok) this.broadcastGameState(); else conn.send({type:'error',message:r.error}); }
      else if(data.type==='call_uno'){ const r=this.game.callUno(p.id); if(r.ok) this.broadcastGameState(); else conn.send({type:'error',message:r.error}); }
      else if(data.type==='catch_uno'){ const r=this.game.catchUno(data.targetId,p.id); if(r.ok) this.broadcastGameState(); else conn.send({type:'error',message:r.error}); }
      else if(data.type==='choose_color'){ const r=this.game.chooseColor(p.id,data.color); if(r.ok) this.broadcastGameState(); else conn.send({type:'error',message:r.error}); }
      else if(data.type==='leave'){ this.removePlayer(p.id,conn); }
    }
  }
  onDisconnect(conn){
    const p=this.connections.get(conn);
    if(p){ this.removePlayer(p.id,conn); }
  }
  removePlayer(pid,conn){
    this.connections.delete(conn);
    this.playerList=this.playerList.filter(x=>x.id!==pid);
    this.broadcastRoomState();
  }
  startGame(){
    if(this.playerList.length<2){ return; }
    this.gamePhase='playing';
    this.game.start(this.playerList.map(p=>({id:p.id,name:p.name})));
    this.broadcastRoomState();
    this.broadcastGameState();
  }
  broadcastRoomState(){
    const msg={type:'room_state',roomId:this.roomId,hostId:'host',players:this.playerList,gamePhase:this.gamePhase};
    for(const [conn] of this.connections) conn.send(msg);
    if(window.__hostCallback) window.__hostCallback(msg);
  }
  broadcastGameState(){
    for(const [conn,p] of this.connections){
      conn.send({type:'game_state',snapshot:this.game.snapshot(p.id)});
    }
    if(window.__hostCallback) window.__hostCallback({type:'game_state',snapshot:this.game.snapshot('host')});
  }
  hostAction(action){
    // 房主自己的操作
    if(action.type==='start_game'){ this.startGame(); }
    else if(action.type==='play_card'){ const r=this.game.playCard('host',action.cardIndex,action.chosenColor); if(r.ok) this.broadcastGameState(); }
    else if(action.type==='draw_card'){ const r=this.game.drawCard('host'); if(r.ok) this.broadcastGameState(); }
    else if(action.type==='pass'){ const r=this.game.passTurn('host'); if(r.ok) this.broadcastGameState(); }
    else if(action.type==='call_uno'){ const r=this.game.callUno('host'); if(r.ok) this.broadcastGameState(); }
    else if(action.type==='catch_uno'){ const r=this.game.catchUno(action.targetId,'host'); if(r.ok) this.broadcastGameState(); }
    else if(action.type==='choose_color'){ const r=this.game.chooseColor('host',action.color); if(r.ok) this.broadcastGameState(); }
    else if(action.type==='ready'){ const pl=this.playerList.find(x=>x.id==='host'); if(pl){pl.ready=!pl.ready; this.broadcastRoomState();} }
  }
}

// ========== P2P 玩家逻辑 ==========
class Player {
  constructor(peer, roomId, name){
    this.peer=peer; this.roomId=roomId; this.name=name; this.playerId=null;
    this.conn=peer.connect(roomId,{reliable:true});
    this.conn.on('open', ()=>{ this.conn.send({type:'join',name}); });
    this.conn.on('data', data=>{ if(window.__playerCallback) window.__playerCallback(data); });
    this.conn.on('close', ()=>{ if(window.__playerCallback) window.__playerCallback({type:'disconnected'}); });
    this.conn.on('error', ()=>{ if(window.__playerCallback) window.__playerCallback({type:'disconnected'}); });
  }
  send(data){ this.conn.send(data); }
}

// ========== UI 状态 ==========
let screen='lobby';
let peer=null, host=null, player=null;
let myId=null, myName='';
let currentSnapshot=null;
let roomState=null;

const app=document.getElementById('app');

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
}

function render(){
  if(screen==='lobby') renderLobby();
  else if(screen==='room') renderRoom();
  else if(screen==='game') renderGame();
}

function renderLobby(){
  app.innerHTML=`
    <div class="lobby">
      <div class="logo-cards">
        <div class="logo-card" style="background:#FF595E">U</div>
        <div class="logo-card" style="background:#FFCA3A;color:#5D4037">N</div>
        <div class="logo-card" style="background:#8AC926">O</div>
        <div class="logo-card" style="background:#1982C4">★</div>
      </div>
      <h1>UNO 派对</h1>
      <p>和朋友一起玩 UNO 卡牌</p>
      <input class="input" id="nameInput" placeholder="输入你的昵称" maxlength="12" value="${myName||''}">
      <button class="btn btn-primary" id="createBtn" style="width:320px;margin-bottom:12px">创建房间</button>
      <div style="display:flex;gap:8px;width:320px">
        <input class="input" id="roomInput" placeholder="输入房间号" style="flex:1;margin-bottom:0">
        <button class="btn btn-secondary" id="joinBtn">加入</button>
      </div>
      <p class="lobby-hint">P2P 直连 · 无需注册 · 房主创建房间后把房间号发给好友</p>
    </div>`;
  document.getElementById('createBtn').onclick=createRoom;
  document.getElementById('joinBtn').onclick=joinRoom;
}

// 生成 4-6 位短房间号
function genRoomId(){
  return String(Math.floor(10000 + Math.random()*90000));
}

function createRoom(){
  myName=document.getElementById('nameInput').value.trim()||'玩家'+Math.floor(Math.random()*1000);
  const roomId=genRoomId();
  app.innerHTML=`<div class="lobby"><p>正在创建房间 ${roomId}...</p></div>`;
  const peerConfig={host:'peerjs-server.onrender.com',port:443,path:'/',secure:true,debug:2};
  peer=new Peer(roomId, peerConfig);
  peer.on('open', id=>{
    host=new Host(peer, myName);
    myId='host';
    window.__hostCallback=onHostMessage;
    host.broadcastRoomState();
    screen='room';
    render();
  });
  peer.on('error', err=>{
    if(err.type==='unavailable-id'){
      // 房间号被占用，重试
      createRoom();
    } else {
      toast('创建失败: '+err.type+'，请重试');
      screen='lobby';
      render();
    }
  });
}

function joinRoom(){
  myName=document.getElementById('nameInput').value.trim()||'玩家'+Math.floor(Math.random()*1000);
  const roomId=document.getElementById('roomInput').value.trim();
  if(!roomId){ toast('请输入房间号'); return; }
  app.innerHTML=`<div class="lobby"><p>正在连接房间 ${roomId}...</p></div>`;
  const peerConfig={host:'peerjs-server.onrender.com',port:443,path:'/',secure:true,debug:2};
  peer=new Peer(peerConfig);
  peer.on('open', ()=>{
    player=new Player(peer, roomId, myName);
    window.__playerCallback=onPlayerMessage;
    // 超时检测
    setTimeout(()=>{
      if(screen!=='room' && screen!=='game'){
        toast('连接超时，请检查房间号是否正确');
        screen='lobby';
        render();
      }
    }, 10000);
  });
  peer.on('error', err=>{ toast('连接失败: '+err.type); screen='lobby'; render(); });
}

function onHostMessage(msg){
  if(msg.type==='room_state'){ roomState=msg; if(screen==='room') render(); }
  else if(msg.type==='game_state'){ currentSnapshot=msg.snapshot; screen='game'; render(); }
}

function onPlayerMessage(msg){
  if(msg.type==='joined'){ myId=msg.playerId; screen='room'; render(); }
  else if(msg.type==='room_state'){ roomState=msg; if(screen==='room') render(); }
  else if(msg.type==='game_state'){ currentSnapshot=msg.snapshot; screen='game'; render(); }
  else if(msg.type==='error'){ toast(msg.message); }
  else if(msg.type==='disconnected'){ toast('与房主断开连接'); screen='lobby'; render(); }
}

function renderRoom(){
  const players=roomState?.players||[];
  const isHost=myId==='host';
  const allReady=players.length>=2&&players.every(p=>p.ready);
  app.innerHTML=`
    <button class="back-btn" id="backBtn">← 退出</button>
    <div class="conn-status online">● 已连接</div>
    <div class="room">
      <div class="room-header">
        <div class="room-id-label">房间号（发给好友）</div>
        <div class="room-id" id="roomIdDisplay">${roomState?.roomId||''}</div>
        <button class="btn btn-secondary" id="copyBtn" style="margin-top:10px;padding:6px 16px;font-size:13px">复制房间号</button>
      </div>
      <div class="player-list">
        ${players.map(p=>`
          <div class="player-item">
            <span class="name">${p.name}${p.isHost?' 👑':''}</span>
            <span class="tag ${p.isHost?'tag-host':(p.ready?'tag-ready':'tag-wait')}">${p.isHost?'房主':(p.ready?'已准备':'未准备')}</span>
          </div>
        `).join('')}
      </div>
      <div class="room-actions">
        ${isHost
          ? `<button class="btn btn-primary" id="startBtn" ${allReady?'':'disabled'}>开始游戏 (${players.filter(p=>p.ready).length}/${players.length})</button>`
          : `<button class="btn btn-primary" id="readyBtn">${players.find(p=>p.id===myId)?.ready?'取消准备':'准备'}</button>`
        }
      </div>
    </div>`;
  document.getElementById('backBtn').onclick=leaveRoom;
  document.getElementById('copyBtn').onclick=()=>{ navigator.clipboard?.writeText(roomState.roomId); toast('房间号已复制'); };
  if(isHost){ document.getElementById('startBtn').onclick=()=>host.hostAction({type:'start_game'}); }
  else { document.getElementById('readyBtn').onclick=()=>player.send({type:'ready'}); }
}

function leaveRoom(){
  if(host){ peer.destroy(); host=null; }
  if(player){ player.send({type:'leave'}); peer.destroy(); player=null; }
  screen='lobby'; render();
}

function renderGame(){
  const snap=currentSnapshot;
  if(!snap) return;
  const me=snap.players.find(p=>p.id===myId);
  const myHand=me?.hand||[];
  const opponents=snap.players.filter(p=>p.id!==myId);
  const topCard=snap.discardTop;
  const isMyTurn=snap.currentPlayerId===myId;
  const showColorPicker=snap.pendingWildColor&&isMyTurn;

  app.innerHTML=`
    <button class="back-btn" id="backBtn">← 退出</button>
    <div class="game">
      <div class="opponents">
        ${opponents.map(p=>`
          <div class="opponent ${snap.currentPlayerId===p.id?'active':''}">
            ${p.hasCalledUno?'<div class="uno-badge">UNO!</div>':''}
            <div class="name">${p.name}</div>
            <div class="count">${p.handCount}</div>
          </div>
        `).join('')}
      </div>
      <div class="turn-indicator ${isMyTurn?'my-turn':''}">${isMyTurn?'🎯 轮到你了':'等待 '+snap.players.find(p=>p.id===snap.currentPlayerId)?.name}</div>
      <div class="center-area">
        <div class="piles">
          <div class="pile">
            <div class="card-back">UNO</div>
            <div class="pile-label">抽牌堆 ${snap.drawPileCount}</div>
          </div>
          <div class="pile discard-pile">
            ${snap.drawStack>0?`<div class="draw-stack-badge">+${snap.drawStack}</div>`:''}
            ${topCard?`<div class="card ${topCard.color}" style="width:56px;height:78px;font-size:22px">${topCard.value}</div>`:'<div class="card-back" style="opacity:.3"></div>'}
            <div class="pile-label">弃牌堆</div>
          </div>
          <div class="pile">
            <div class="color-indicator" style="background:${COLOR_HEX[snap.activeColor]||'#ccc'}"></div>
            <div class="pile-label">当前颜色</div>
          </div>
        </div>
      </div>
      <div class="my-hand" id="myHand">
        ${myHand.map((c,i)=>{
          const playable=isMyTurn&&canPlay(c,topCard,snap.activeColor,snap.drawStack);
          return `<div class="card ${c.color} ${playable?'playable':'unplayable'}" data-idx="${i}">${c.value}</div>`;
        }).join('')}
      </div>
      <div class="game-actions">
        <button class="action-btn" id="drawBtn" ${isMyTurn&&!snap.pendingWildColor?'':'disabled'}>抽牌</button>
        <button class="action-btn" id="passBtn" ${isMyTurn&&!snap.pendingWildColor?'':'disabled'}>过牌</button>
        <button class="action-btn uno" id="unoBtn" ${me&&me.handCount===1?'':'disabled'}>喊 UNO!</button>
      </div>
    </div>
    ${showColorPicker?`
      <div class="color-picker">
        <div class="color-picker-inner">
          ${COLORS.map(c=>`<div class="color-btn" style="background:${COLOR_HEX[c]}" data-color="${c}"></div>`).join('')}
        </div>
      </div>`:''}
    ${snap.winner?`
      <div class="winner-overlay">
        <h2>🏆 ${snap.players.find(p=>p.id===snap.winner)?.name} 获胜!</h2>
        <button class="btn btn-primary" id="backToLobby">返回大厅</button>
      </div>`:''}
  `;
  document.getElementById('backBtn').onclick=leaveRoom;
  if(snap.winner){ document.getElementById('backToLobby').onclick=leaveRoom; return; }

  // 手牌点击
  document.querySelectorAll('.card[data-idx]').forEach(el=>{
    el.onclick=()=>{
      const idx=parseInt(el.dataset.idx);
      const card=myHand[idx];
      if(!isMyTurn) return;
      if(!canPlay(card,topCard,snap.activeColor,snap.drawStack)){ toast('这张牌不能出'); return; }
      if(card.type===CARD_TYPE.WILD||card.type===CARD_TYPE.WILD4){
        showColorPickerForCard(idx);
      } else {
        sendAction({type:'play_card',cardIndex:idx});
      }
    };
  });
  document.getElementById('drawBtn').onclick=()=>sendAction({type:'draw_card'});
  document.getElementById('passBtn').onclick=()=>sendAction({type:'pass'});
  document.getElementById('unoBtn').onclick=()=>sendAction({type:'call_uno'});
  if(showColorPicker){
    document.querySelectorAll('.color-btn').forEach(el=>{
      el.onclick=()=>sendAction({type:'choose_color',color:el.dataset.color});
    });
  }
}

function showColorPickerForCard(cardIndex){
  const picker=document.createElement('div');
  picker.className='color-picker';
  picker.innerHTML=`<div class="color-picker-inner">${COLORS.map(c=>`<div class="color-btn" style="background:${COLOR_HEX[c]}" data-color="${c}"></div>`).join('')}</div>`;
  document.body.appendChild(picker);
  picker.querySelectorAll('.color-btn').forEach(el=>{
    el.onclick=()=>{ picker.remove(); sendAction({type:'play_card',cardIndex,chosenColor:el.dataset.color}); };
  });
}

function sendAction(action){
  if(host) host.hostAction(action);
  else if(player) player.send(action);
}

// 启动
render();
</script>
